[package]
name = "engine-rust"
version = "0.1.0"
edition = "2021"
authors = ["Victor Freitas <victor@ecostream.ucab.ve>"]
description = "EcoStream 3R - Motor de Simulación Autoritativo en Tiempo Real (Tokio / Tonic 20Hz)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
