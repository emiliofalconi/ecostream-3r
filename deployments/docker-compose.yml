services:
  # ----------------------------------------------------------------------------
  # Base de Datos Relacional: PostgreSQL 16 (Persistencia Principal ACID)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ecostream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecostream_db}
      POSTGRES_USER: ${POSTGRES_USER:-ecostream_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecostream_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecostream_user} -d ${POSTGRES_DB:-ecostream_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecostream-net

  # ----------------------------------------------------------------------------
  # Caché en Memoria: Redis 7 (Lobbies y Cache-Aside)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecostream-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecostream-net

  # ----------------------------------------------------------------------------
  # Control Plane & API Gateway (Go 1.23+)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ../gateway-go
      dockerfile: Dockerfile
    container_name: ecostream-gateway
    restart: unless-stopped
    environment:
      GATEWAY_HTTP_PORT: 8080
      GATEWAY_GRPC_PORT: 50051
      DATABASE_URL: postgres://${POSTGRES_USER:-ecostream_user}:${POSTGRES_PASSWORD:-ecostream_secure_pass}@postgres:5432/${POSTGRES_DB:-ecostream_db}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_eco_jwt_key_ucab_2026_change_in_prod}
      HMAC_SECRET: ${HMAC_SECRET:-super_secret_eco_hmac_ticket_key_2026}
      JWT_EXPIRATION_HOURS: 24
      CORS_ALLOWED_ORIGINS: "*"
      SIMULATION_ENGINE_URL: "engine:50052"
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ecostream-net

  # ----------------------------------------------------------------------------
  # Data Plane & Simulación en Tiempo Real (Rust Tokio / Tonic 20Hz)
  # ----------------------------------------------------------------------------
  engine:
    build:
      context: ../engine-rust
      dockerfile: Dockerfile
    container_name: ecostream-engine-rust
    restart: unless-stopped
    environment:
      SIMULATION_GRPC_PORT: 50052
      TICK_RATE_HZ: 20
      GATEWAY_INTERNAL_URL: "http://gateway:50051"
      HMAC_SECRET: ${HMAC_SECRET:-super_secret_eco_hmac_ticket_key_2026}
    ports:
      - "50052:50052"
    networks:
      - ecostream-net

  # ----------------------------------------------------------------------------
  # Administrador Visual de Base de Datos: pgAdmin 4 (Opcional para inspección)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecostream-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecostream.ucab.ve}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecostream-net

networks:
  ecostream-net:
    driver: bridge
    name: ecostream-network

volumes:
  postgres_data:
    name: ecostream_postgres_data
  redis_data:
    name: ecostream_redis_data
