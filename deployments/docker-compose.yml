services:
  # ----------------------------------------------------------------------------
  # Base de Datos Relacional: PostgreSQL 16 (Persistencia Principal)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ecostream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecostream_db}
      POSTGRES_USER: ${POSTGRES_USER:-ecostream_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecostream_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecostream_user} -d ${POSTGRES_DB:-ecostream_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecostream-net

  # ----------------------------------------------------------------------------
  # Administrador Visual de Base de Datos: pgAdmin 4 (Opcional para inspección)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecostream-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecostream.ucab.ve}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecostream-net

networks:
  ecostream-net:
    driver: bridge
    name: ecostream-network

volumes:
  postgres_data:
    name: ecostream_postgres_data
